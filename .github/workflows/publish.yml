name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Swift packages distribute two ways:
#   1. Swift Package Manager — clients consume directly from the git tag,
#      so creating the GitHub Release is sufficient. No registry push.
#   2. CocoaPods — `pod trunk push Authio.podspec` against the global
#      CocoaPods trunk. Requires a session token, gated by COCOAPODS_TRUNK_TOKEN.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.2.1
        with:
          generate_release_notes: true

  cocoapods:
    runs-on: macos-14
    env:
      COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - name: Lint podspec
        run: pod lib lint Authio.podspec --allow-warnings
      - name: Publish to CocoaPods trunk
        if: env.COCOAPODS_TRUNK_TOKEN != ''
        run: pod trunk push Authio.podspec --allow-warnings
      - name: Skip publish (no COCOAPODS_TRUNK_TOKEN secret)
        if: env.COCOAPODS_TRUNK_TOKEN == ''
        run: |
          echo "::notice::COCOAPODS_TRUNK_TOKEN secret is not set; skipping pod trunk push."
          echo "Set COCOAPODS_TRUNK_TOKEN in Settings → Secrets → Actions, then re-tag to release."