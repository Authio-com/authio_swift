name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Swift Package Manager is the primary distribution channel. Clients pin a
# git tag via Xcode → Add Package Dependencies or a Package.swift dependency.
# Tag pushes create a GitHub Release so the tag is discoverable; no registry
# push is required. Authio.podspec remains for legacy git-sourced CocoaPods
# installs only — CocoaPods trunk publishing was removed after trunk sunset.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.2.1
        with:
          generate_release_notes: true
